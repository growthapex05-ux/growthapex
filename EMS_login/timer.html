<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrowthApex EMS - Live Working Timer</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #0f172a;
      padding: 16px;
      font-family: 'Space Grotesk', sans-serif;
      text-align: center;
      color: #ffffff;
      overflow: hidden;
      user-select: none;
    }
    .timer-box {
      background: rgba(30, 41, 59, 0.95);
      border: 2px solid #38bdf8;
      border-radius: 18px;
      padding: 16px;
      width: 100%;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
    }
    .title-row {
      font-size: 10px;
      color: #38bdf8;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .badge {
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: 700;
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.4);
      display: inline-block;
      margin-bottom: 8px;
    }
    .clock {
      font-family: 'JetBrains Mono', monospace;
      font-size: 30px;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
      margin: 6px 0;
    }
    .meta {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .btn-checkout {
      width: 100%;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #ffffff;
      border: none;
      padding: 11px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
      transition: all 0.2s ease;
    }
    .btn-checkout:hover {
      background: #b91c1c;
      transform: translateY(-1px);
    }
    .btn-checkout:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="timer-box">
    <div class="title-row">GROWTHAPEX EMS LIVE TIMER</div>
    <div id="status-badge" class="badge">🟢 ACTIVE WORKING</div>
    <div id="clock-val" class="clock">00 : 00 : 00</div>
    <div class="meta">Check-In Time: <b id="checkin-val" style="color:#cbd5e1">--:--</b></div>
    <button class="btn-checkout" id="btn-checkout">⏹️ MARK CHECK-OUT</button>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey:            "AIzaSyAA84W6KghuGz8C3usn26igTGv_WAOCP34",
      authDomain:        "growthapex-f811b.firebaseapp.com",
      projectId:         "growthapex-f811b",
      storageBucket:     "growthapex-f811b.firebasestorage.app",
      messagingSenderId: "1047657399663",
      appId:             "1:1047657399663:web:32f0d5b33c64e28d7f149a"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>
  <script src="/EMS_login/ems-firebase.js"></script>

  <script>
    const sess = JSON.parse(localStorage.getItem('ems_session') || '{}');
    const empId = sess.id;

    if (!empId) {
      document.body.innerHTML = '<div style="color:#ef4444;font-weight:700;padding:20px">Not Authenticated</div>';
    }

    let checkInDate = new Date();

    async function initTimerPage() {
      const today = new Date().toISOString().split('T')[0];
      const todayRec = await EMS_DB.getTodayAttendance(empId);

      if (!todayRec || !todayRec.checkIn || (todayRec.checkOut && todayRec.checkOut !== '—')) {
        document.getElementById('clock-val').textContent = 'CHECKED OUT';
        document.getElementById('status-badge').innerHTML = '🔴 CHECKED OUT';
        document.getElementById('status-badge').style.background = 'rgba(239,68,68,0.2)';
        document.getElementById('status-badge').style.color = '#f87171';
        setTimeout(() => window.close(), 2000);
        return;
      }

      const checkInStr = todayRec.checkIn;
      document.getElementById('checkin-val').textContent = checkInStr;

      // Parse checkIn time
      if (checkInStr.includes('AM') || checkInStr.includes('PM')) {
        const parts = checkInStr.trim().split(' ');
        let [hours, minutes, seconds] = parts[0].split(':');
        if (!seconds) seconds = '00';
        if (hours === '12') hours = '00';
        if (parts[1] === 'PM') hours = parseInt(hours, 10) + 12;
        checkInDate.setHours(parseInt(hours, 10), parseInt(minutes, 10), parseInt(seconds, 10), 0);
      } else {
        const [h, m, s] = checkInStr.split(':');
        if (h !== undefined) checkInDate.setHours(parseInt(h, 10));
        if (m !== undefined) checkInDate.setMinutes(parseInt(m, 10));
        if (s !== undefined) checkInDate.setSeconds(parseInt(s, 10));
      }

      // Update timer clock every second
      setInterval(() => {
        const now = new Date();
        let diffSecs = Math.floor((now - checkInDate) / 1000);
        if (diffSecs < 0) diffSecs = 0;

        const hrs = String(Math.floor(diffSecs / 3600)).padStart(2, '0');
        const mins = String(Math.floor((diffSecs % 3600) / 60)).padStart(2, '0');
        const secs = String(diffSecs % 60).padStart(2, '0');

        document.getElementById('clock-val').textContent = `${hrs} : ${mins} : ${secs}`;
      }, 1000);

      // Heartbeat & status sync
      setInterval(async () => {
        const rec = await EMS_DB.getTodayAttendance(empId);
        if (rec) {
          if (rec.activityStatus === 'idle') {
            document.getElementById('status-badge').innerHTML = '🟡 IDLE (AWAY)';
            document.getElementById('status-badge').style.background = 'rgba(245,158,11,0.2)';
            document.getElementById('status-badge').style.color = '#fbbf24';
          } else {
            document.getElementById('status-badge').innerHTML = '🟢 ACTIVE WORKING';
            document.getElementById('status-badge').style.background = 'rgba(34,197,94,0.2)';
            document.getElementById('status-badge').style.color = '#4ade80';
          }

          if (rec.checkOut && rec.checkOut !== '—') {
            window.close();
          }
        }
      }, 4000);
    }

    initTimerPage();

    // Check-out button
    document.getElementById('btn-checkout').onclick = async () => {
      const today = new Date().toISOString().split('T')[0];
      const time  = new Date().toLocaleTimeString('en-IN', { hour12: false });
      const rec   = await EMS_DB.getTodayAttendance(empId);
      if (rec) {
        await EMS_DB.markAttendance({ empId, date: today, status: rec.status, checkIn: rec.checkIn, checkOut: time });
      }
      alert('Checked out successfully!');
      if (window.opener) {
        try { window.opener.location.reload(); } catch(e) {}
      }
      window.close();
    };
  </script>
</body>
</html>
