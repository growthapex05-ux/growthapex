<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrowthApex EMS - Live Working Timer</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #0f172a;
      padding: 16px;
      font-family: 'Space Grotesk', sans-serif;
      text-align: center;
      color: #ffffff;
      overflow: hidden;
      user-select: none;
    }
    .timer-box {
      background: rgba(30, 41, 59, 0.95);
      border: 2px solid #38bdf8;
      border-radius: 18px;
      padding: 16px;
      width: 100%;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
    }
    .title-row {
      font-size: 10px;
      color: #38bdf8;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .badge {
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: 700;
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.4);
      display: inline-block;
      margin-bottom: 8px;
    }
    .clock {
      font-family: 'JetBrains Mono', monospace;
      font-size: 30px;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
      margin: 6px 0;
    }
    .meta {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .btn-checkout {
      width: 100%;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #ffffff;
      border: none;
      padding: 11px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
      transition: all 0.2s ease;
    }
    .btn-checkout:hover {
      background: #b91c1c;
      transform: translateY(-1px);
    }
    .btn-checkout:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="timer-box">
    <div class="title-row">GROWTHAPEX EMS LIVE TIMER</div>
    <div id="status-badge" class="badge">🟢 ACTIVE WORKING</div>
    <div id="clock-val" class="clock">00 : 00 : 00</div>
    <div class="meta">Check-In Time: <b id="checkin-val" style="color:#cbd5e1">--:--</b></div>
    <button class="btn-checkout" id="btn-checkout">⏹️ MARK CHECK-OUT</button>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey:            "AIzaSyAA84W6KghuGz8C3usn26igTGv_WAOCP34",
      authDomain:        "growthapex-f811b.firebaseapp.com",
      projectId:         "growthapex-f811b",
      storageBucket:     "growthapex-f811b.firebasestorage.app",
      messagingSenderId: "1047657399663",
      appId:             "1:1047657399663:web:32f0d5b33c64e28d7f149a"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>
  <script src="/EMS_login/ems-firebase.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    let empId = params.get('empId');
    let checkInStr = params.get('checkIn');
    let dateStr = params.get('date');

    if (!empId) {
      const sess = JSON.parse(localStorage.getItem('ems_session') || '{}');
      empId = sess.id;
    }

    let checkInDate = new Date();
    let clockStarted = false;

    function parseCheckInDate(timeStr, dStr) {
      if (!timeStr || timeStr === '--:--') return new Date();

      const result = new Date();
      if (dStr) {
        const parts = dStr.split('-');
        if (parts.length === 3) {
          result.setFullYear(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        }
      }

      const cleanStr = timeStr.trim();
      if (cleanStr.includes('AM') || cleanStr.includes('PM')) {
        const parts = cleanStr.split(' ');
        const tParts = parts[0].split(':');
        let hours = parseInt(tParts[0] || '0', 10);
        const minutes = parseInt(tParts[1] || '0', 10);
        const seconds = parseInt(tParts[2] || '0', 10);

        if (parts[1].toUpperCase() === 'PM' && hours < 12) hours += 12;
        if (parts[1].toUpperCase() === 'AM' && hours === 12) hours = 0;

        result.setHours(hours, minutes, seconds, 0);
      } else {
        const tParts = cleanStr.split(':');
        const hours = parseInt(tParts[0] || '0', 10);
        const minutes = parseInt(tParts[1] || '0', 10);
        const seconds = parseInt(tParts[2] || '0', 10);
        result.setHours(hours, minutes, seconds, 0);
      }

      return result;
    }

    function startClock(timeVal, dVal) {
      if (clockStarted) return;
      clockStarted = true;

      if (timeVal) {
        document.getElementById('checkin-val').textContent = timeVal;
        checkInDate = parseCheckInDate(timeVal, dVal);
      }

      const updateTick = () => {
        const now = new Date();
        let diffSecs = Math.floor((now - checkInDate) / 1000);
        if (diffSecs < 0) diffSecs = 0;

        const hrs = String(Math.floor(diffSecs / 3600)).padStart(2, '0');
        const mins = String(Math.floor((diffSecs % 3600) / 60)).padStart(2, '0');
        const secs = String(diffSecs % 60).padStart(2, '0');

        document.getElementById('clock-val').textContent = `${hrs} : ${mins} : ${secs}`;
      };

      updateTick();
      setInterval(updateTick, 1000);
    }

    // Start timer immediately from URL params if available!
    if (checkInStr && checkInStr !== 'null' && checkInStr !== 'undefined') {
      startClock(checkInStr, dateStr);
    }

    // Firestore sync in background
    async function syncFirestoreState() {
      if (!empId) return;
      try {
        const todayRec = await EMS_DB.getTodayAttendance(empId);
        if (todayRec && todayRec.checkIn) {
          if (!clockStarted) {
            startClock(todayRec.checkIn, todayRec.date);
          }

          if (todayRec.activityStatus === 'idle') {
            const badge = document.getElementById('status-badge');
            badge.innerHTML = '🟡 IDLE (AWAY)';
            badge.style.background = 'rgba(245,158,11,0.2)';
            badge.style.color = '#fbbf24';
          } else {
            const badge = document.getElementById('status-badge');
            badge.innerHTML = '🟢 ACTIVE WORKING';
            badge.style.background = 'rgba(34,197,94,0.2)';
            badge.style.color = '#4ade80';
          }

          // Only close if checkOut is explicitly marked and valid
          if (todayRec.checkOut && todayRec.checkOut !== '—') {
            document.getElementById('clock-val').textContent = 'CHECKED OUT';
            document.getElementById('status-badge').innerHTML = '🔴 CHECKED OUT';
            document.getElementById('status-badge').style.background = 'rgba(239,68,68,0.2)';
            document.getElementById('status-badge').style.color = '#f87171';
            setTimeout(() => window.close(), 1500);
          }
        }
      } catch(e) {
        console.warn('Sync timer state error:', e);
      }
    }

    syncFirestoreState();
    setInterval(syncFirestoreState, 5000);

    // Check-out button handler
    document.getElementById('btn-checkout').onclick = async () => {
      if (!empId) return;
      const btn = document.getElementById('btn-checkout');
      btn.disabled = true;
      btn.textContent = '⌛ Checking out...';

      const today = new Date().toISOString().split('T')[0];
      const time  = new Date().toLocaleTimeString('en-IN', { hour12: false });
      const rec   = await EMS_DB.getTodayAttendance(empId);
      
      if (rec && rec.checkIn) {
        await EMS_DB.markAttendance({ empId, date: today, status: rec.status, checkIn: rec.checkIn, checkOut: time });
      }

      if (window.opener) {
        try { window.opener.location.reload(); } catch(e) {}
      }
      window.close();
    };
  </script>
</body>
</html>
