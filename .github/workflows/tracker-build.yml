name: Build GrowthApex Tracker

# Builds the desktop tracker for Windows (.exe) and Mac (.dmg, Intel + Apple Silicon) and attaches
# them to a GitHub Release. Start it by pushing a tag like tracker-v1.0.1 (or run it manually).
# Download links used by the EMS: /releases/latest/download/GrowthApex-Tracker-Setup.exe and .dmg

on:
  push:
    tags: ['tracker-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: dist:win
            file: tracker/dist/GrowthApex-Tracker-Setup.exe
          - os: macos-latest
            cmd: dist:mac
            file: tracker/dist/GrowthApex-Tracker.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: tracker
        run: npm ci

      - name: Build installer
        working-directory: tracker
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned build (no Apple / Windows signing certificate)
        run: npm run ${{ matrix.cmd }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.file }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.file }}
          name: GrowthApex Tracker ${{ github.ref_name }}
          body: |
            Desktop tracker for the GrowthApex EMS.
            - Windows: GrowthApex-Tracker-Setup.exe (if Windows warns "protected your PC": More info → Run anyway)
            - Mac: GrowthApex-Tracker.dmg (first time: right-click the app → Open)
