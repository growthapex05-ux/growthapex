<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'">
  <title>GrowthApex Tracker — Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="login-hero">
      <img src="../assets/mark.png" alt="GrowthApex">
      <div class="wordmark"><span class="g">Growth</span><span class="a">Apex</span></div>
      <p>Attendance tracker · Employee login</p>
    </div>

    <div class="update" id="update"></div>

    <div class="card">
      <form id="f">
        <label for="id">Employee ID or email</label>
        <input id="id" autocomplete="username" placeholder="EMP003 or name@gmail.com" required>
        <label for="pw">Password <span class="light">(same as the EMS portal)</span></label>
        <input id="pw" type="password" autocomplete="current-password" required>
        <label class="check"><input id="remember" type="checkbox" checked> Keep me logged in on this computer</label>
        <button id="btn" class="btn-brand full mt" type="submit">Login &amp; Check-In</button>
        <div class="err" id="err"></div>
      </form>
    </div>

    <div class="note"><span>🔒</span><span>While you are checked in, this app records your attendance and work activity
      (apps and websites used, idle time, location and periodic screenshots) for the GrowthApex admin.
      Nothing is recorded after you check out.</span></div>
    <div class="foot"><span id="ver"></span><span></span></div>
  </div>
  <script src="update.js"></script>
  <script src="login.js"></script>
</body>
</html>
