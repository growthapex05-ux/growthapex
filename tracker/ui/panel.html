<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'">
  <title>GrowthApex Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="../assets/mark.png" alt="">
      <div><div class="wordmark"><span class="g">Growth</span><span class="a">Apex</span></div><small>Attendance tracker</small></div>
      <div class="avatar" id="avatar" title="">—</div>
    </div>

    <div class="update" id="update"></div>

    <div class="card hero">
      <div class="hero-top">
        <span class="hello" id="hello">Hello</span>
        <span class="status" id="status">Checked out</span>
      </div>
      <div class="big" id="worked">00:00:00</div>
      <div class="meta" id="inout">Not checked in yet</div>
    </div>

    <div class="row actions">
      <button class="btn-green" id="checkin">Check-In</button>
      <button class="btn-red" id="checkout">Check-Out</button>
    </div>
    <button class="btn-amber full mb" id="break">☕ Start break</button>

    <div class="card">
      <h3>⏱ Project timer</h3>
      <div id="timer-running" class="chip">No project running</div>
      <div class="stack">
        <input id="project" list="projects" aria-label="Project / client" placeholder="Project / client — e.g. Client X Instagram">
        <datalist id="projects"></datalist>
        <input id="note" aria-label="What are you working on" placeholder="What are you working on? (optional)">
      </div>
      <div class="row mt">
        <button class="btn-brand" id="pstart">▶ Start</button>
        <button class="btn-ghost" id="pstop">■ Stop</button>
      </div>
    </div>

    <div class="err" id="err"></div>
    <div id="perm" class="note mb"></div>
    <div class="note"><span>🔒</span><span id="privacy">Work tracking is on while you are checked in. Your activity is shared with the GrowthApex admin.</span></div>
    <div class="foot">
      <span id="ver"></span>
      <span><button class="btn-link" id="upd-check">Check for updates</button><button class="btn-link" id="logout">Log out</button></span>
    </div>
  </div>
  <script src="update.js"></script>
  <script src="panel.js"></script>
</body>
</html>
