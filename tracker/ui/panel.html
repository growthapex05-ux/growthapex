<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'">
  <title>GrowthApex Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="../assets/icon.png" alt=""><div><b id="name">GrowthApex Tracker</b><span id="sub">—</span></div></div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="status s-off" id="status">Checked out</span>
        <span class="muted" id="inout"></span>
      </div>
      <div class="big" id="worked">00:00:00</div>
      <div class="muted" id="split">Active 0m · Idle 0m · Break 0m</div>
      <div class="row" style="margin-top:12px">
        <button class="btn-green" id="checkin">✅ Check-In</button>
        <button class="btn-red" id="checkout">⏹ Check-Out</button>
      </div>
      <button class="btn-amber" id="break" style="width:100%;margin-top:8px">☕ Start Break</button>
    </div>

    <div class="card">
      <b>⏱ Project timer</b>
      <div id="timer-running" class="muted" style="margin:6px 0">No project running</div>
      <label for="project">Project / client</label>
      <input id="project" list="projects" placeholder="e.g. Client X — Instagram posts">
      <datalist id="projects"></datalist>
      <label for="note">What are you working on? (optional)</label>
      <input id="note" placeholder="e.g. 5 reels editing">
      <div class="row" style="margin-top:10px">
        <button id="pstart">▶ Start</button>
        <button class="btn-ghost" id="pstop">■ Stop</button>
      </div>
    </div>

    <div class="card">
      <b>🖥️ Now</b> <span class="muted" id="now">—</span>
      <div class="list" id="top" style="margin-top:6px"></div>
    </div>

    <div class="err" id="err"></div>
    <div id="perm" class="note"></div>
    <button class="btn-ghost" id="logout" style="width:100%;margin-top:8px">Log out</button>
  </div>
  <script src="panel.js"></script>
</body>
</html>
