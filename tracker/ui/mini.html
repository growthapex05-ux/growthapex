<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'">
  <title>GrowthApex Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="mini-body">
  <div class="mini" id="mini">
    <img src="../assets/mark.png" alt="" class="mini-logo">
    <div class="mini-info">
      <div class="mini-time" id="m-time">00:00:00</div>
      <div class="mini-status"><i id="m-dot"></i><span id="m-label">Checked out</span></div>
    </div>
    <button class="mini-btn btn-green" id="m-in">Check-In</button>
    <button class="mini-btn btn-red" id="m-out">Check-Out</button>
    <button class="mini-open" id="m-open" title="Open GrowthApex Tracker">⤢</button>
  </div>
  <script src="mini.js"></script>
</body>
</html>
